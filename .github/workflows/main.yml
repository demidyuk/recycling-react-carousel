name: main

on:
  push:
  pull_request:

jobs:
  validate:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.18'
            full: false
          - os: ubuntu-latest
            node: '24'
            full: true
          - os: windows-latest
            node: '24'
            full: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build

      - name: Check formatting
        if: matrix.full
        run: npm run format:check

      - name: Lint
        if: matrix.full
        run: npm run lint

      - name: Check package size
        if: matrix.full
        run: npm run size

      - name: Validate package metadata
        if: matrix.full
        run: npm run pack:check

      - name: Test packed React 18 and 19 consumers
        if: matrix.full
        run: npm run test:package

      - name: Build public Storybook
        if: matrix.full
        run: npm run build-storybook

      - name: Upload builds
        if: matrix.full
        uses: actions/upload-artifact@v7
        with:
          name: builds
          path: |
            dist
            storybook-static

  react-18:
    name: React 18.0 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install React 18 compatibility matrix
        run: npm install --no-save react@18.0.0 react-dom@18.0.0 @types/react@18 @types/react-dom@18

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  browser:
    name: Browser interaction tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Test browser interactions
        run: npm run test:browser

      - name: Build library
        run: npm run build

      - name: Test packed browser consumers
        run: npm run test:package:browser

  release:
    name: Release
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/alpha')
    needs: [validate, react-18, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          name: builds

      - name: Publish release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  storybook:
    name: Deploy Storybook
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [validate, react-18, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          name: builds

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: storybook-static
          clean: true
          target-folder: docs
